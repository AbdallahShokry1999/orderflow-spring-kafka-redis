spring.application.name=orderflow

# --- PostgreSQL (override with SPRING_DATASOURCE_* env vars, as docker-compose does) ---
spring.datasource.url=jdbc:postgresql://localhost:5432/orderflow
spring.datasource.username=orderflow
spring.datasource.password=orderflow
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# --- Redis cache ---
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.cache.type=redis
spring.cache.redis.time-to-live=5m

# --- Kafka ---
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=orderflow-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.example.orderflow.event
spring.kafka.listener.ack-mode=manual

# --- Actuator ---
management.endpoint.health.show-details=always
